name: mac-selfcheck
# 맥 접속기를 진짜 맥에서 계정 없이 점검: 화면 단추 클릭(--uicheck) → 끝까지(--selfcheck: 사전 패치 · 설치 · 자바) → 새 판 바꿔 끼우기 sh.
on:
  push:
    branches: [mac-smoke]
    paths: ['.github/workflows/mac-selfcheck.yml', 'tools/**']
  workflow_dispatch:
env:
  ZIP: Hana_world_Mac-v7.3.1-cand.zip
jobs:
  selfcheck:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: 환경
        run: |
          sw_vers
          uname -m
      - name: 내려받기 · 풀기
        run: |
          curl -sSL -o mac.zip "https://github.com/gusals96223-design/hanaworld-launcher/releases/download/patch-index/$ZIP"
          shasum -a 256 mac.zip
          mkdir out
          ditto -x -k mac.zip out
          ls -la out
          cp -R "out/Hana world.app" /Applications/
          mkdir -p shots
      - name: 바꿔 끼우기 시험
        continue-on-error: true
        run: |
          sh tools/test-replace.sh "/Applications/Hana world.app" mac.zip 2>&1 | tail -60
      - name: 화면 단추 점검(--uicheck)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          (sleep 20; screencapture -x shots/uicheck-20s.png) &
          (sleep 45; screencapture -x shots/uicheck-45s.png) &
          (sleep 70; screencapture -x shots/uicheck-70s.png) &
          HANA_SELFCHECK=1 "/Applications/Hana world.app/Contents/MacOS/HanaWorld" --uicheck > uicheck.out 2> uicheck.err
          echo "exit=$?" | tee uicheck.exit
          grep -v "^Photino.NET" uicheck.out | tail -c 6000
          echo "--- stderr"; tail -c 2000 uicheck.err
      - name: 끝까지 점검(--selfcheck)
        continue-on-error: true
        timeout-minutes: 35
        run: |
          pkill -f HanaWorldLauncher || true
          (sleep 60; screencapture -x shots/selfcheck-60s.png) &
          (sleep 240; screencapture -x shots/selfcheck-240s.png) &
          HANA_SELFCHECK=1 "/Applications/Hana world.app/Contents/MacOS/HanaWorld" --selfcheck > selfcheck.out 2> selfcheck.err
          echo "exit=$?" | tee selfcheck.exit
          grep -v "^Photino.NET" selfcheck.out | tail -c 12000
          echo "--- stderr"; tail -c 3000 selfcheck.err
      - name: 기록 모으기
        if: always()
        run: |
          mkdir -p logs
          cp -R "$HOME/Library/Application Support/Hana world/logs" logs/ 2>/dev/null || echo "기록 폴더 없음"
          cp uicheck.out uicheck.err uicheck.exit selfcheck.out selfcheck.err selfcheck.exit logs/ 2>/dev/null || true
          du -sh "$HOME/Library/Application Support/Hana world" 2>/dev/null || true
          for f in logs/logs/uicheck-*.log logs/logs/selfcheck-*.log; do echo "=== $f"; tail -c 6000 "$f"; done 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-selfcheck-${{ matrix.os }}
          path: |
            shots
            logs
